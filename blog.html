<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog &amp; Thoughts | Alex Morgan</title>
  <meta name="description" content="Read insights, tutorials, and reflections on data analysis, machine learning, visualization, and the data industry from Alex Morgan.">
  <meta name="keywords" content="data blog, data analysis blog, machine learning articles, data visualization tutorials, data science thoughts">
  <meta name="author" content="Alex Morgan">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://alexmorgan.dev/blog.html">

  <meta property="og:title" content="Blog &amp; Thoughts | Alex Morgan">
  <meta property="og:description" content="Insights, tutorials, and reflections on data analysis, machine learning, and the data industry.">
  <meta property="og:type" content="blog">
  <meta property="og:url" content="https://alexmorgan.dev/blog.html">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog &amp; Thoughts | Alex Morgan">
  <meta name="twitter:description" content="Insights, tutorials, and reflections on data analysis.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="grid-12">
        <div class="nav-logo">
          <a href="/">AM.</a>
        </div>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/blog.html" class="active">Blog</a>
        </div>
      </div>
    </div>
  </nav>

  <main>

    <!-- PAGE HEADER -->
    <header class="page-header" aria-label="Blog header">
      <div class="container">
        <div class="section-layout">
          <div class="section-sidebar">
            <span class="section-label">Index</span>
          </div>
          <div class="section-content">
            <h1 class="section-headline">Blog<br>&amp; Thoughts.</h1>
            <p class="body-text" style="margin-top: 16px; max-width: 500px;">
              Insights, tutorials, and reflections on data analysis, machine learning,
              and building things that matter.
            </p>
            <div class="blog-filters" role="tablist" aria-label="Filter posts by category">
              <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All Posts</button>
              <button class="filter-btn" data-filter="blog" role="tab" aria-selected="false">Blog</button>
              <button class="filter-btn" data-filter="thoughts" role="tab" aria-selected="false">Thoughts</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- POSTS -->
    <section class="posts-section" aria-label="Blog posts list">
      <div class="container">
        <div class="posts-grid" id="postsContainer" role="list">
          <!-- Posts rendered by JS -->
        </div>
        <div class="no-posts" id="noPosts">
          <p>No posts found.</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Alex Morgan &mdash; Data Analyst</p>
    </div>
  </footer>

  <!-- POST MODAL -->
  <div class="modal-overlay" id="postModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      <div class="post-meta">
        <span class="category-badge" id="modalCategory"></span>
        <span class="post-date" id="modalDate"></span>
      </div>
      <h2 class="post-title" id="modalTitle"></h2>
      <div class="post-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/blog.js"></script>
</body>
</html>
